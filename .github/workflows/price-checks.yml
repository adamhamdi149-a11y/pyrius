# Runs Pyrius's tracked-price checks every 6 hours. Vercel's free plan only allows a daily cron,
# so this schedule fills the gaps. The endpoint only checks trackers that are due, so extra runs are harmless.
# Needs the repository secret CRON_SECRET (the same value as the CRON_SECRET environment variable on Vercel).
name: Price checks

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run due price checks
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "The CRON_SECRET repository secret isn't set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS -m 90 -H "Authorization: Bearer $CRON_SECRET" https://pyrius.app/api/cron/price-checks
